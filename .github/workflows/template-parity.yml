# --- This Repository's Own Contract ---
#
# 📐 Template Parity
#
# Purpose: enforce the five-differences contract in README.md against the
# public template, so drift fails a check instead of waiting to be noticed -
# and, when you ask, bring the public template's changes here through the
# same contract, so most drift never needs fixing by hand.
#
# ⚠️ THIS CONTRACT WAS PROSE-ONLY, AND IT DRIFTED. The README states that any
# difference outside the permitted five "is drift, and drift is a defect".
# Every other rule in this system has a gate beside it - the standards are
# explicit that a rule without a gate is a rule nobody enforces. This one was
# the exception, and eight seeded documents had quietly diverged by the time
# anybody diffed the trees.
#
# ⚠️ THE GUARD IS INVERTED HERE, AND THAT IS DELIBERATE. Most optional
# workflows in this repository carry `!is_template`, so they are silent in the
# template and come alive in repositories generated from it. Like 🏷️ Cut
# Release, this one is the reverse: `is_template` is true ONLY in this
# repository, so the check runs here and never in anything generated from it.
# A generated repository is meant to diverge - that is what it is for - and a
# parity check there would fail on its owner's first commit. It stays inert
# scaffolding they can delete, like any other workflow that does not fit.
#
# WHY THIS IS LOCAL RATHER THAN CALLED FROM THE STANDARDS. Logic is normally
# published there so a fix reaches every repository pinned to it. This check
# runs in exactly one repository and has no fleet to reach, so calling it
# would buy nothing and cost a release cycle: a new reusable workflow does
# not exist at `@v1` until a release moves the tag, and the stub would fail
# `verify-stubs.yml` until it did. `self-checks.yml` in the standards
# repository is local for the same reason - it is about that repository
# alone. The
# sync job still MERGES with the standards' own engine, through its action:
# the wiring is local, the logic is called.
#
# ⚠️ THE SYNC RUNS ONLY WHEN YOU ASK. Dispatch this workflow with `sync`
# ticked and it proposes the public template's changes as one pull request
# on `chore/template-parity`, mapped through the contract: the seeds move to
# .github/docs/ and take this repository's footer, nothing absent, inherited
# or sync-never arrives, and every other file is merged so the permitted
# differences survive. Nothing schedules it - the daily run only checks.
#
# ---

name: '📐 Template Parity'

on:
  push:
  pull_request:
  schedule:
    - cron: '30 6 * * *' # daily: the baseline is a separate repository and moves independently
  workflow_dispatch:
    inputs:
      sync:
        description: "Also propose the public template's changes here, as a pull request"
        required: false
        type: boolean
        default: false

concurrency:
  # One queue per event, so the daily check can never take the place of a
  # sync you asked for that is waiting its turn.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  parity:
    name: '📐 Five Differences'
    # Runs ONLY in the template itself. See the inverted-guard note above.
    #
    # A pull request always runs. A direct push runs only on the default
    # branch, WHATEVER IT IS CALLED - the same guard every job in checks.yml
    # carries, and for the same reason: without it a branch with an open pull
    # request runs this twice on one commit, and this job clones two whole
    # repositories each time.
    if: ${{ github.event.repository.is_template && (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # read this repository, and the public baseline
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: '📐 Comparing this template against the public one, under the five-differences contract.'

      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: this
          persist-credentials: false

      # ⚠️ THE CONTRACT NAMES THE BASELINE, AND NOW THE CHECKOUT OBEYS IT.
      # `baseline:` used to be read only to print in the verdict line, while
      # the repository actually compared was written into the step below. The
      # two could disagree silently: change the key and the check went on
      # comparing the old repository while confidently reporting the new name.
      # A contract term the gate ignores is the drift this workflow exists to
      # catch, in the workflow itself.
      - name: '📖 Read the baseline the contract names'
        id: contract
        run: |
          set -euo pipefail
          pip install --quiet 'PyYAML==6.0.2'
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, sys, yaml

          contract = yaml.safe_load(
              pathlib.Path('this/.github/template-parity.yml').read_text(encoding='utf-8')
          )
          baseline = (contract or {}).get('baseline')
          if not baseline:
              sys.exit('::error::The contract names no `baseline:` repository to compare against.')
          print(f'baseline={baseline}')
          PY

      # The baseline is public, so this needs no token even though the
      # repository doing the checking is private.
      - name: '📥 Checkout the public baseline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.contract.outputs.baseline }}
          path: baseline
          persist-credentials: false

      - name: '🧪 Test the scripts this repository ships'
        # A check nobody has tested is a check nobody should believe. This runs
        # before the comparison: a broken enforcer must fail here, loudly,
        # rather than a few seconds later as a confident "0 problem(s)".
        #
        # The repository validator is tested here too, for want of a better
        # home: it runs as the `ci` job's lint-command, and that job is a stub
        # calling a reusable workflow whose input is a single command string.
        # Chaining a second command into it would be a guess about the callee's
        # contract, so its tests hang off the one workflow this repository owns
        # outright. The public template has no equivalent and runs neither.
        run: |
          set -euo pipefail
          python3 this/.github/scripts/test_template_parity.py
          python3 this/.github/scripts/test_validate_repository.py
          python3 this/.github/scripts/test_gitignore.py

      - name: '📐 Compare against the contract'
        run: |
          set -euo pipefail
          python3 this/.github/scripts/template-parity.py this baseline

  sync:
    name: '📐 Sync From The Baseline'
    # Runs ONLY in the template itself, like the check, and ONLY when asked:
    # a dispatch with `sync` ticked. The daily schedule never reaches it.
    if: ${{ github.event.repository.is_template && github.event_name == 'workflow_dispatch' && inputs.sync }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the sync branch (PR-only flow)
      issues: write # keep the waiting-files issue current
      pull-requests: write # open or update the sync pull request
    steps:
      - name: '🛡️ Harden Runner'
        uses: tannergolden/standards/actions/harden@v1
        with:
          egress-policy: audit
          notice: "📐 Bringing the public template's changes here as a pull request, through the five-differences contract."

      # The default branch, whatever branch the run was dispatched from: the
      # pull request targets it, and a sync worked out on a feature branch
      # would carry that branch's commits into it.
      - name: '📂 Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The contract is read by its own parser, the one the check uses, and
      # written out as the mapping the standards' template sync reads - so
      # the check and the sync can never disagree about what it says.
      - name: '📖 Write The Contract Out As A Mapping'
        id: contract
        run: |
          set -euo pipefail
          pip install --quiet 'PyYAML==6.0.2'
          python3 .github/scripts/template-parity.py --sync-map . > "${RUNNER_TEMP}/parity-map.json"
          baseline="$(python3 -c 'import yaml; print((yaml.safe_load(open(".github/template-parity.yml", encoding="utf-8")) or {}).get("baseline") or "")')"
          if [ -z "$baseline" ]; then
            echo "::error::The contract names no \`baseline:\` repository to sync from."
            exit 1
          fi
          echo "baseline=${baseline}" >> "$GITHUB_OUTPUT"

      # The baseline is public, so this needs no token. It is followed at its
      # default branch - the tree the check compares against - so what the
      # check calls drift is exactly what the sync proposes.
      - name: '📥 Fetch The Baseline'
        id: fetch
        env:
          BASELINE: ${{ steps.contract.outputs.baseline }}
        run: |
          set -euo pipefail
          git clone --bare --quiet "https://github.com/${BASELINE}.git" "${RUNNER_TEMP}/baseline.git"
          echo "ref=$(git -C "${RUNNER_TEMP}/baseline.git" symbolic-ref --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: '📐 Sync'
        id: sync
        uses: tannergolden/standards/actions/template-sync@v1
        with:
          mode: run
          template-dir: ${{ runner.temp }}/baseline.git
          template: ${{ steps.contract.outputs.baseline }}
          ref: ${{ steps.fetch.outputs.ref }}
          # Decided from the token itself: none, or a classic one without
          # the workflow scope, holds workflow files back instead of
          # failing the push - and the whole pull request with it.
          workflow-files: auto
          workflow-token: ${{ secrets.BOT_ACCESS_TOKEN }}
          map: ${{ runner.temp }}/parity-map.json

      - name: '🚀 Propose The Sync As A Pull Request'
        if: ${{ steps.sync.outputs.changed == 'true' }}
        uses: tannergolden/standards/actions/open-pr@v1
        with:
          token: ${{ secrets.BOT_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          branch: 'chore/template-parity'
          commit-title: ${{ steps.sync.outputs.commit-title }}
          commit-body: |
            Automated pass of the parity sync. Each file the public template
            changed was merged with this repository's own version, through the
            five-differences contract. A file that could not merge was left
            untouched and is named in the pull request; its baseline did not
            move, so it is offered again on the next run.
          pr-title: ${{ steps.sync.outputs.pr-title }}
          pr-body: ${{ steps.sync.outputs.report }}

      - name: '📌 Keep What Waits In View'
        if: ${{ success() }}
        uses: tannergolden/standards/actions/template-sync@v1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          mode: track
          version: ${{ steps.sync.outputs.version }}
          map: ${{ runner.temp }}/parity-map.json
